<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grammar Coach</title>
<style>
:root{--bg:#04141c;--pn:#0a2230;--ln:#14405a;--tx:#e8fbff;--mu:#86b3c4;--ac:#12D6D0;--hi:#F4FFB0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,"Segoe UI","Helvetica Neue",Arial,sans-serif;padding:20px}
main{max-width:1040px;margin:auto}
h1{font:800 clamp(1.8rem,4vw,2.6rem)/1.1 Inter,"Segoe UI",Arial,sans-serif;margin:0;letter-spacing:-.02em}
.sub{color:var(--mu);margin:4px 0 14px}
button,select{font:inherit;color:var(--tx);background:var(--pn);border:1.5px solid var(--ln);border-radius:8px;padding:7px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.35;cursor:default}button.on{background:var(--ac);color:#04141c;border-color:var(--ac);font-weight:700}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.sec{border:1.5px solid var(--ln);border-radius:12px;margin-bottom:14px;background:var(--pn)}
.hd{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;width:100%;padding:14px 18px;cursor:pointer;font:700 1.15rem Inter,"Segoe UI",Arial,sans-serif}
.hd:focus-visible{outline:3px solid var(--hi)}.hd i{color:var(--mu);font-weight:400;font-size:.9rem;font-style:normal;margin-left:auto;padding-left:12px}
.hd::after{content:"+";margin-left:12px;color:var(--ac)}.open .hd::after{content:"\2212"}
.bd{overflow:hidden}.in{padding:0 18px 18px}
.view{position:relative;overflow:hidden;border-radius:10px;background:var(--bg);width:100%}
.fit,.cam{position:absolute;left:0;top:0;transform-origin:0 0}
.cam{background-image:linear-gradient(rgba(18,214,208,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(18,214,208,.09) 1px,transparent 1px);background-size:80px 80px}
.w{position:absolute;left:0;top:0;white-space:nowrap;font:800 54px/1.2 Inter,"Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em}
.lb{position:absolute;left:0;top:0;text-align:center;color:var(--c);font-size:19px;line-height:1.25;opacity:0}
.lb i{display:block;height:5px;border-radius:3px;background:var(--c);margin-bottom:6px;transform-origin:0 50%}.lb b{display:block}.lb small{display:block;opacity:.75;font-size:16px}
.capbox{position:absolute;left:0;right:0;bottom:0;display:grid;padding:36px 4% 12px;background:linear-gradient(transparent,rgba(4,20,28,.95) 45%)}
.cap{grid-area:1/1;opacity:0;text-align:center}.cap b{display:block;font-size:clamp(.95rem,2.6vw,1.6rem);font-weight:700}.cap span{color:var(--ac);font-size:clamp(.8rem,1.9vw,1.15rem)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
.row input[type=range]{flex:1;min-width:160px;accent-color:var(--ac)}
.panel{overflow:hidden;height:0;border-left:4px solid var(--hi);background:var(--bg);border-radius:6px}
.panel>div{padding:10px 14px}.panel em{display:block;color:var(--ac);font-style:normal;margin-top:2px}
#tr{width:100%;aspect-ratio:900/340;background:var(--bg);border-radius:10px;display:block}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main>
<h1>Grammar Coach</h1>
<p class="sub">From caveman English to a real sentence. <span lang="es"></span></p>

<section class="sec open"><button class="hd" aria-expanded="true">1. The ladder <i>la escalera</i></button><div class="bd"><div class="in">
 <div class="view" id="v1"></div>
 <div class="row"><button id="pp">Play</button><input type="range" id="sl" min="0" max="1000" value="0" aria-label="Timeline"></div>
 <div class="row" id="lvb"></div><div class="row" id="qs"></div><div class="panel" id="wh"><div></div></div>
</div></div></section>

<section class="sec"><button class="hd" aria-expanded="false">2. Branch the tenses <i>ramifica los tiempos</i></button><div class="bd"><div class="in">
 <div class="row"><button id="br">Play branches</button></div>
 <svg id="tr" viewBox="0 0 900 340" role="img" aria-label="Tense tree for The car is red"></svg>
</div></div></section>

<section class="sec"><button class="hd" aria-expanded="false">3. Active and passive <i>activa y pasiva</i></button><div class="bd"><div class="in">
 <div class="row" id="tb"></div><div class="view" id="v3"></div>
 <div class="row"><button id="va">Active</button><button id="vp">Passive</button></div><p id="vf" style="color:var(--mu);margin:0"></p>
</div></div></section>
</main>
